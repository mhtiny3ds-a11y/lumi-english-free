@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1310; --bg-2:#241A15; --surface:#2A1F19; --surface-2:#33261E; --line:#4A3829;
  --ink:#FBEFDF; --ink-2:#D3BFAB; --ink-3:#9C8573;
  --red:#FF5468; --red-ink:#1B1310; --gold:#FFC24D; --gold-soft:#4A3716; --jade:#3CC79A; --jade-soft:#173B30;
  --sky:#6AA8E6; --plum:#A88CF0; --wrong:#FF7A63; --wrong-soft:#4A221B;
  --shadow:0 2px 0 rgba(0,0,0,.35),0 12px 26px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1310; --bg-2:#241A15; --surface:#2A1F19; --surface-2:#33261E; --line:#4A3829;
  --ink:#FBEFDF; --ink-2:#D3BFAB; --ink-3:#9C8573;
  --red:#FF5468; --red-ink:#1B1310; --gold:#FFC24D; --gold-soft:#4A3716; --jade:#3CC79A; --jade-soft:#173B30;
  --sky:#6AA8E6; --plum:#A88CF0; --wrong:#FF7A63; --wrong-soft:#4A221B;
  --shadow:0 2px 0 rgba(0,0,0,.35),0 12px 26px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
#app.bare{padding-bottom:28px}

/* ===== mascot ===== */
.mascot{display:block;flex:none}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes rise{from{transform:translateY(12px);opacity:.0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.say{display:flex;align-items:flex-start;gap:10px}
.say .bubble{flex:1;min-width:0}

/* ===== shared ===== */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-2)}
.tiny{font-size:13px}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-size:30px;font-weight:800}
.h2{font-size:22px;font-weight:800}
.h3{font-size:18px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-family:var(--f-display);font-weight:800;font-size:18px;background:var(--red);color:var(--red-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 70%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--red) 70%,#000)}
.btn.block{width:100%}
.btn.jade{background:var(--jade);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--jade) 65%,#000)}
.btn.gold{background:var(--gold);color:#2B1D14;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 65%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--sky);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:color-mix(in srgb,var(--gold) 55%,var(--ink))}
.pill.jade{background:var(--jade-soft);color:var(--jade)}
.pill.red{background:color-mix(in srgb,var(--red) 14%,var(--surface));color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:14px;color:var(--ink-2)}
.input{min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.input:focus{border-color:var(--sky);outline:none}
.err{color:var(--wrong);font-weight:700;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800}
.chip.on{border-color:var(--c,var(--red));background:color-mix(in srgb,var(--c,var(--red)) 14%,var(--surface));color:var(--c,var(--red))}
.divider{height:2px;background:var(--line);border-radius:2px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;z-index:60;max-width:calc(100% - 32px);text-align:center;animation:rise .25s}

/* ===== welcome ===== */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.01em;line-height:1}
.brand b{color:var(--red)}
.cast{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);width:100%}
.choice .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none;background:var(--surface-2)}
.choice b{font-family:var(--f-display);font-size:19px;display:block}

/* ===== PIN ===== */
.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);font-weight:800}
.ava{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:var(--ac,var(--surface-2));flex:none}
.ava.sm{width:42px;height:42px;font-size:24px}
.ava.xs{width:32px;height:32px;font-size:18px}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink-3)}
.dots i.on{background:var(--red);border-color:var(--red)}
.dots.bad{animation:shake .35s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.pad button{height:62px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font-family:var(--f-display);font-size:26px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:none}

/* ===== child header ===== */
.topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
.topbar .who{flex:1;min-width:0}
.topbar .who b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statpill{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}

/* ===== world + path ===== */
.world{border-radius:var(--r-lg);padding:16px;color:#fff;background:var(--c);position:relative;overflow:hidden;display:flex;gap:12px;align-items:center}
.world::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.world .t{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.05}
.world .s{font-weight:700;opacity:.92;font-size:14px}
.world .bar{height:10px;border-radius:10px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:8px}
.world .bar i{display:block;height:100%;background:#fff;border-radius:10px}
.gradebar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.gradebar .chip{flex:none}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding:14px 0 10px}
.book{align-self:stretch;display:flex;align-items:center;gap:10px;margin:8px 0 2px}
.book::before,.book::after{content:"";flex:1;height:2px;background:var(--line)}
.book span{font-family:var(--f-display);font-weight:800;color:var(--ink-3);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(calc(var(--x,0) * 1px));width:150px}
.node .disc{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 62%,#000);position:relative;transition:transform .1s}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 62%,#000)}
.node.review .disc{border-radius:24px;background:var(--gold);box-shadow:0 6px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.node.locked .disc{background:var(--surface-2);box-shadow:0 6px 0 var(--line);filter:grayscale(1);opacity:.75}
.node.current .disc{outline:5px solid color-mix(in srgb,var(--c) 35%,transparent);outline-offset:4px}
.node .no{position:absolute;bottom:-6px;right:-6px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;font-size:12px;font-weight:800;padding:0 7px;font-family:var(--f-display)}
.node .lbl{font-weight:800;font-size:14px;text-align:center;line-height:1.2}
.node .st{font-size:13px;letter-spacing:1px;color:var(--gold);font-weight:800}
.node .here{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:12px;font-weight:800;white-space:nowrap;color:var(--ink)}

/* ===== sheet ===== */
.scrim{position:fixed;inset:0;background:rgba(30,18,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:rise .15s}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grip{width:48px;height:5px;border-radius:5px;background:var(--line);align-self:center}
.lessonrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);text-align:left;width:100%}
.lessonrow .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--surface-2);flex:none}
.lessonrow .tx{flex:1;min-width:0}
.lessonrow .tx b{display:block;font-family:var(--f-display);font-size:17px}
.lessonrow[disabled]{opacity:.5}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:2px 8px;font-weight:700;font-size:14px}

/* ===== tabbar ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--surface);border-top:2px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar .in{display:flex;width:100%;max-width:480px;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 8px;border-radius:14px;font-weight:800;font-size:12px;color:var(--ink-3);min-width:64px}
.tab .i{font-size:24px;line-height:1;filter:grayscale(.8);opacity:.75}
.tab.on{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.tab.on .i{filter:none;opacity:1}
.tab .dot{position:absolute}

/* ===== lesson player ===== */
.player{min-height:100%;display:flex;flex-direction:column;gap:16px;padding-bottom:150px}
.ptop{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
.x{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--ink-3)}
.prog{flex:1;height:16px;border-radius:16px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--jade);border-radius:16px;transition:width .3s}
.qtitle{font-family:var(--f-display);font-weight:800;font-size:22px}
.flash{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 16px;animation:rise .25s}
.big{font-size:96px;line-height:1.1}
.glyph{display:inline-grid;place-items:center;min-width:1.6em;padding:0 .2em;height:1.3em;border-radius:.3em;background:var(--gold-soft);color:color-mix(in srgb,var(--gold) 45%,var(--ink));font-family:var(--f-display);font-weight:800;line-height:1;font-size:.7em}
.big .glyph{font-size:64px}
.word{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.1}
.mean{font-size:18px;color:var(--ink-2);font-weight:700}
.speak{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;background:var(--sky);color:#fff;font-weight:800;box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.speak.round{width:96px;height:96px;border-radius:50%;justify-content:center;font-size:42px;padding:0}
.speak.sm{min-height:40px;padding:0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:96px;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:19px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.opt.pic{font-size:54px}
.opt.pic .glyph{font-size:40px}
.opts.one .opt{min-height:60px;font-size:17px;justify-content:flex-start;flex-direction:row;text-align:left;padding:12px 16px}
.opt.ok{border-color:var(--jade);background:var(--jade-soft);box-shadow:0 4px 0 var(--jade)}
.opt.no{border-color:var(--wrong);background:var(--wrong-soft);box-shadow:0 4px 0 var(--wrong);animation:shake .35s}
.opt[disabled]{pointer-events:none}
.sent{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.3;text-align:center}
.sent .gap{display:inline-block;min-width:90px;border-bottom:4px solid var(--ink-3);margin:0 4px;color:var(--jade)}
.tray{min-height:64px;border-radius:var(--r-md);border:2px dashed var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface-2)}
.tray.ok{border-color:var(--jade);background:var(--jade-soft)}
.tray.no{border-color:var(--wrong);background:var(--wrong-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:48px;min-width:48px;padding:0 12px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--f-display);font-weight:800;font-size:20px}
.tile.used{visibility:hidden}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:2px solid var(--line)}
.feedback.ok{background:var(--jade-soft);border-color:var(--jade)}
.feedback.no{background:var(--wrong-soft);border-color:var(--wrong)}
.feedback .in{width:100%;max-width:448px;display:flex;flex-direction:column;gap:10px}
.feedback .msg{display:flex;align-items:center;gap:10px}
.feedback .msg b{font-family:var(--f-display);font-size:20px;display:block}
.feedback.ok .msg b{color:var(--jade)}
.feedback.no .msg b{color:var(--wrong)}

/* ===== result ===== */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:20px}
.stars3{display:flex;gap:8px;font-size:56px;line-height:1}
.stars3 span{animation:pop .5s both}
.stars3 span:nth-child(2){animation-delay:.15s}
.stars3 span:nth-child(3){animation-delay:.3s}
.stars3 .off{filter:grayscale(1);opacity:.25}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;font-weight:800;color:var(--ink-3)}

/* ===== rewards ===== */
.jar{display:flex;gap:16px;align-items:center}
.ring{--p:0;width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--surface-2) 0)}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.money{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--jade);font-variant-numeric:tabular-nums;line-height:1.1}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);text-align:center;font-weight:800;font-size:13px;line-height:1.2}
.badge .b{font-size:34px;line-height:1}
.badge.off{opacity:.45}
.badge.off .b{filter:grayscale(1)}
.ledger{display:flex;flex-direction:column}
.ledger .li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.ledger .li:last-child{border-bottom:0}
.ledger .li .tx{flex:1;min-width:0;font-weight:700}
.ledger .li .tx small{display:block;color:var(--ink-3);font-weight:700;font-size:12px}
.ledger .li .n{font-weight:800;color:color-mix(in srgb,var(--gold) 55%,var(--ink));font-variant-numeric:tabular-nums;white-space:nowrap}

/* ===== missions ===== */
.mission{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow)}
.mission .hd{display:flex;align-items:center;gap:10px}
.mission .hd .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--surface-2);flex:none}
.mission .hd .tx{flex:1;min-width:0}
.mission .hd b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.2}
.mission p{font-weight:600}

/* ===== parent ===== */
.pheader{display:flex;align-items:center;gap:12px;padding-block:6px}
.kid{display:flex;flex-direction:column;gap:12px}
.meter{height:14px;border-radius:14px;background:var(--surface-2);overflow:hidden;border:2px solid var(--line)}
.meter i{display:block;height:100%;background:var(--gold);border-radius:14px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px}

const CUR = {};

let REMOTE = null, rTimer = null, rBusy = false, rDirty = false, SYNC = 'local';
async function initRemote() {

      for (const [fid, rf] of Object.entries(rem)) {
        const lf = STORE.families[fid];

    else if (UI.view !== 'lesson') render();

}
function queueRemote() { if (!REMOTE) return; rDirty = true; clearTimeout(rTimer); rTimer = setTimeout(flushRemote, 1200); }

/* ---------- password hash ---------- */
async function hashPw(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lumi:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 2166136261; for (const c of 'lumi:' + s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16); }
}

const fam = () => STORE.families[DEV.session?.fid || DEV.familyId];
const childOf = (f, cid) => f?.children.find(c => c.id === cid);
function prog(f, cid) { f.progress[cid] ||= { lessons: {}, missions: {}, ledger: [], log: [], streak: { last: null, count: 0 }, secs: {} }; return f.progress[cid]; }
const capOf = f => Math.min(MAX_CAP, Math.max(5, f.weeklyCap || MAX_CAP));
function weekStars(f, cid, wk = weekKey()) { return prog(f, cid).ledger.filter(e => e.wk === wk).reduce((a, e) => a + e.counted, 0); }
function award(f, cid, n, reason) {
  const p = prog(f, cid), wk = weekKey(), have = weekStars(f, cid, wk);
  const counted = Math.max(0, Math.min(n, capOf(f) - have));
  p.ledger.push({ id: uid(), ts: Date.now(), wk, n, counted, reason, paid: false });
  return { n, counted, over: n - counted, total: have + counted };
}
const unpaid = (f, cid) => prog(f, cid).ledger.filter(e => !e.paid).reduce((a, e) => a + e.counted, 0);
function bumpStreak(p) {
  const t = dayKey(), y = dayKey(addDays(new Date(), -1));

}
const streakNow = p => (p.streak.last === dayKey() || p.streak.last === dayKey(addDays(new Date(), -1))) ? p.streak.count : 0;
function nodeDone(p, node) { return node.type === 'unit' ? (p.lessons[node.key + 'l1'] > 0 && p.lessons[node.key + 'l2'] > 0) : p.lessons[node.key] > 0; }
function nodeStars(p, node) { return node.type === 'unit' ? (p.lessons[node.key + 'l1'] || 0) + (p.lessons[node.key + 'l2'] || 0) : (p.lessons[node.key] || 0); }
const learnGrade = (f, c) => prog(f, c.id).lastGrade || c.grade;
function nodeStates(f, child, g) {
  const p = prog(f, child.id), list = nodesOf(g); let currentSet = false;
  return list.map((n, i) => {
    const done = nodeDone(p, n);
    let open = f.unlockAll || i === 0 || nodeDone(p, list[i - 1]);
    let current = false; if (open && !done && !currentSet) { current = true; currentSet = true; }
    return { ...n, done, open, current, stars: nodeStars(p, n) };

}
function lessonsDone(p) { return Object.values(p.lessons).filter(v => v > 0).length; }
function wordsLearned(p) { let n = 0; for (const g in CUR) CUR[g].forEach(u => { if (p.lessons[unitKey(g, u.n) + 'l1'] > 0) n += u.words.length; }); return n; }
function badgesOf(f, cid) {
  const p = prog(f, cid), ld = lessonsDone(p), three = Object.values(p.lessons).filter(v => v === 3).length;
  const mApproved = Object.values(p.missions).filter(m => m.status === 'approved').length;
  const weeks = {}; p.ledger.forEach(e => weeks[e.wk] = (weeks[e.wk] || 0) + e.counted);
  const maxWeek = Math.max(0, ...Object.values(weeks));
  const gradeDone = g => nodesOf(g).every(n => nodeDone(p, n));
  const list = [
    ['🌱', 'Bước đầu tiên', ld >= 1], ['📚', 'Chăm học 10 bài', ld >= 10], ['🏅', 'Chăm học 30 bài', ld >= 30],
    ['🌟', '5 bài 3 sao', three >= 5], ['🔥', 'Học 3 ngày liền', p.streak.count >= 3], ['☄️', 'Học 7 ngày liền', p.streak.count >= 7],
    ['🎯', 'Nhiệm vụ đầu tiên', mApproved >= 1], ['🤝', '5 nhiệm vụ', mApproved >= 5], ['💰', 'Đủ 50 sao một tuần', maxWeek >= MAX_CAP]
  ];

  let body = '';
  if (UI.tab === 'learn') body = vLearn(f, c, p);
  else if (UI.tab === 'missions') body = vMissions(f, c, p);
  else if (UI.tab === 'rewards') body = vRewards(f, c, p);
  else body = vMe(f, c, p);
  const pending = Object.values(p.missions).filter(m => m.status === 'pending').length;
  const tabs = [['learn', '🗺️', 'Học'], ['missions', '🎯', 'Nhiệm vụ'], ['rewards', '⭐', 'Hũ sao'], ['me', ava(c.avatar, 'xs'), 'Của con']];
  return top + body + `<nav class="tabbar" aria-label="Điều hướng"><div class="in">${tabs.map(([k, i, t]) => `<button class="tab ${UI.tab === k ? 'on' : ''}" data-act="tab" data-t="${k}" aria-current="${UI.tab === k}"><span class="i">${i}</span>${t}${k === 'missions' && pending ? ` <span class="pill red" style="padding:0 6px;font-size:11px">${pending}</span>` : ''}</button>`).join('')}</div></nav>`;
}

    else if (findFamily(login)) UI.err = 'Số điện thoại/email này đã có tài khoản. Hãy đăng nhập.';
    else if (pass.length < 6) UI.err = 'Mật khẩu cần ít nhất 6 ký tự.';
    else if (!validPin(ppin)) UI.err = 'Mã PIN ba mẹ gồm đúng 4 chữ số.';
    else { UI.reg = Object.assign(UI.reg, { step: 2, login, passHash: await hashPw(pass), ppin, kids: [] }); UI.edit = null; UI.err = ''; return go('register'); }
    render();
  },
  reg2: (fd, form) => {
    const r = UI.reg; const c = readChild(fd, form); if (!c) return render();
    const id = uid(); const f = { id: 'f' + uid(), parentName: r.name, login: r.login, passHash: r.passHash, parentPin: r.ppin, weeklyCap: 50, unlockAll: false, createdAt: Date.now(), children: [{ id, ...c }], progress: {}, payouts: [] };
    STORE.families[f.id] = f; saveFam(f);
    DEV.familyId = f.id; DEV.session = { type: 'parent', fid: f.id }; saveDev(); UI.edit = null;
    go('parent', { ptab: 'home', fresh: true }); toast(`Đã tạo tài khoản! Con đăng nhập bằng mã PIN ${c.pin}.`);
  },
  addChild: (fd, form) => { const f = fam(); const c = readChild(fd, form); if (!c) return render(); f.children.push({ id: uid(), ...c }); UI.sheet = null; UI.edit = null; saveFam(f); toast(`Đã thêm ${c.name}.`); },
  editChild: (fd, form) => {
    const f = fam(); const c = childOf(f, UI.editCid); const v = readChild(fd, form); if (!c || !v) return render();
    Object.assign(c, v); UI.sheet = null; UI.edit = null; saveFam(f); toast('Đã lưu hồ sơ.');
  },
  bonus: fd => {
    const f = fam(), o = Object.assign({ cid: f.children[0]?.id, n: 2 }, UI.bonus); const reason = (fd.get('reason') || '').trim() || 'Ba mẹ thưởng';
    if (!o.cid) return; const r = award(f, o.cid, o.n, '🎁 ' + reason); UI.bonus = { cid: o.cid, n: 2, reason: '' }; saveFam(f);
    toast(r.counted ? `Đã tặng ${r.counted} sao cho ${childOf(f, o.cid).name}` : `Tuần này ${childOf(f, o.cid).name} đã đủ ${capOf(f)} sao.`);
  },
  forgot: async fd => {
    if (UI.forgotLock && Date.now() < UI.forgotLock) return;
    const f = findFamily(fd.get('login')), ppin = (fd.get('ppin') || '').trim(), pass = fd.get('pass') || '';
    if (!f || f.demo) { UI.err = 'Máy này chưa có tài khoản đó.'; return render(); }
    if (ppin !== f.parentPin) { UI.forgotTries = (UI.forgotTries || 0) + 1; if (UI.forgotTries >= 5) { UI.forgotLock = Date.now() + 60000; UI.forgotTries = 0; setTimeout(render, 60500); } UI.err = 'Mã PIN ba mẹ chưa đúng.'; return render(); }
    if (pass.length < 6) { UI.err = 'Mật khẩu mới cần ít nhất 6 ký tự.'; return render(); }
    f.passHash = await hashPw(pass); saveFam(f); UI.forgotTries = 0; go('parentLogin'); toast('Đã đặt mật khẩu mới. Mời ba mẹ đăng nhập.');
  },
  parentInfo: async fd => {
    const f = fam(); const name = fd.get('name').trim(), ppin = fd.get('ppin').trim(), pass = fd.get('pass');
    if (!name) { UI.err = 'Tên hiển thị không được để trống.'; return render(); }
    if (ppin && !validPin(ppin)) { UI.err = 'Mã PIN ba mẹ gồm đúng 4 chữ số.'; return render(); }
    if (pass && pass.length < 6) { UI.err = 'Mật khẩu cần ít nhất 6 ký tự.'; return render(); }
    f.parentName = name; if (ppin) f.parentPin = ppin; if (pass) f.passHash = await hashPw(pass); UI.err = ''; saveFam(f); toast('Đã lưu thay đổi.');
  }
};
function readChild(fd, form) {
  const name = (fd.get('name') || '').trim(), pin = (fd.get('pin') || '').trim();
  const editing = form?.dataset.form === 'editChild';
  const orig = editing ? childOf(fam(), UI.editCid) : null;
  const grade = UI.edit?.grade || orig?.grade || 1, avatar = UI.edit?.avatar || orig?.avatar || '🐰';
  if (!name) { UI.err = 'Nhập tên của con.'; return null; }
  if (!validPin(pin)) { UI.err = 'Mã PIN của con gồm đúng 4 chữ số.'; return null; }
  UI.err = ''; return { name, pin, grade, avatar };
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'INPUT') return;
  const a = ACT[t.dataset.act]; if (!a) return;
  if (t.type === 'submit' && t.form) return;
  if (t.dataset.act === 'closeSheet' && e.target.closest('[data-stop]')) return;
  e.preventDefault(); a(t.dataset, t, e);
});
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]'); if (!form) return; e.preventDefault();
  const h = FORMS[form.dataset.form]; if (h) h(new FormData(form), form);
});
document.addEventListener('input', e => {
  if (e.target.dataset.actInput === 'cap') { const f = fam(); f.weeklyCap = +e.target.value; const lbl = e.target.previousElementSibling.querySelector('b'); if (lbl) lbl.textContent = `${f.weeklyCap} sao = ${vnd(f.weeklyCap * STAR)}`; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'importFile' && e.target.files[0]) {
    e.target.files[0].text().then(t => { try { const d = JSON.parse(t); if (d.app !== 'lumi-english' || !d.families) throw 0; UI.importData = { families: d.families, n: Object.keys(d.families).length, names: Object.values(d.families).map(x => x.parentName).join(', ') }; UI.confirm = 'import'; render(); } catch (er) { toast('File không đúng định dạng sao lưu của Lumi.'); } });
    return;
  } if (e.target.dataset.actInput === 'cap') { const f = fam(); saveFam(f); render(); } });
document.addEventListener('keydown', e => {
  if (UI.view === 'pin' && /^[0-9]$/.test(e.key)) ACT.pinKey({ k: e.key });
  else if (UI.view === 'pin' && e.key === 'Backspace') ACT.pinKey({ k: 'del' });
  else if (UI.view === 'lesson' && e.key === 'Enter' && (document.activeElement === document.body || !document.activeElement) && (UI.L.state !== null || !curItem().scored) && !UI.confirm) nextItem();
});

/* ---------- parent area auto-lock (10 phút không thao tác) ---------- */
let LAST_ACT = Date.now();
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => { LAST_ACT = Date.now(); }, true));
setInterval(() => {
  if (DEV.session?.type === 'parent' && Date.now() - LAST_ACT > 10 * 60 * 1000) { DEV.session = null; saveDev(); go('profiles'); toast('Khu vực ba mẹ đã tự khóa sau 10 phút không dùng.'); }
}, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DEV.session?.type === 'parent' && Date.now() - LAST_ACT > 10 * 60 * 1000) { DEV.session = null; saveDev(); go('profiles'); } });

/* ---------- Android back button ---------- */
let GUARD = false;
function isRoot() { return !UI.sheet && !UI.confirm && (UI.view === 'welcome' || (UI.view === 'child' && UI.tab === 'learn') || (UI.view === 'parent' && UI.ptab === 'home')); }
function handleBack() {
  if (UI.view === 'lesson') { UI.confirm = 'quit'; render(); return; }
  if (UI.sheet || UI.confirm) { UI.sheet = null; UI.confirm = null; UI.edit = null; UI.err = ''; render(); return; }
  const v = UI.view;
  if (v === 'child') { UI.tab = 'learn'; render(); return; }
  if (v === 'parent') { UI.ptab = 'home'; render(); return; }
  if (v === 'result') return go('child', { tab: 'learn' });
  if (v === 'pin') return go('profiles');
  if (v === 'gradePick') { DEV.session = null; saveDev(); return go('profiles'); }
  if (v === 'forgot') return go('parentLogin');
  if (v === 'legal') return ACT.closeLegal();
  if (v === 'register' && UI.reg.step === 2) { UI.reg.step = 1; return go('register'); }
  go('welcome');
}
if (FREE) window.addEventListener('popstate', () => { GUARD = false; if (!isRoot()) handleBack(); syncGuard(); });
function syncGuard() { if (!FREE) return; try { if (!isRoot() && !GUARD) { history.pushState({ lumi: 1 }, ''); GUARD = true; } } catch (e) {} }

/* ---------- boot ---------- */
(async function boot() {
  loadLocal();
  await seedDemo();
  const s = DEV.session; const f = s && STORE.families[s.fid];
  if (f && s.type === 'child' && childOf(f, s.cid)) { UI.view = 'child'; UI.grade = learnGrade(f, childOf(f, s.cid)); }
  else { DEV.session = null; saveDev(); UI.view = (DEV.familyId && STORE.families[DEV.familyId]) ? 'profiles' : 'welcome'; }
  render();
  initRemote();
})();
</script></body></html>
